# Local development stack (your PC). Runs MySQL + Django + Next.js with hot reload.
# Not for the server. No nginx / no SSL — you open the app directly.
#
#   App (frontend):  http://localhost:3000
#   API (backend):   http://localhost:8000/api
#
# Usage (see LOCAL_SETUP.md):
#   copy .env.local.example  ->  .env.local   (defaults are fine for local)
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d --build
#   docker compose -f docker-compose.local.yml --env-file .env.local exec backend python manage.py migrate
name: alqavi-local

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_HOST: db
      DB_PORT: "3306"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app          # live source — code edits reload automatically
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      WATCHPACK_POLLING: "true"   # reliable file-watching on Windows bind mounts
    volumes:
      - ./frontend:/app           # live source — hot reload
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  frontend_node_modules:
