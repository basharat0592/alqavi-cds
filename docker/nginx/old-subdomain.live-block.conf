# ============================================================================
# APPEND this to the LIVE nginx config on the server:
#   /opt/alqavi-cds/docker/nginx/default.conf
#
# It is ADDITIVE — it adds a new server_name for old.alqavitraders.com and does
# NOT change the existing alqavitraders.com blocks. After appending, ALWAYS run:
#   docker compose --env-file .env exec nginx nginx -t      # must say "syntax is ok"
#   docker compose --env-file .env exec nginx nginx -s reload
# Do NOT reload if `nginx -t` fails — the live site keeps running on the old config.
#
# Requires: the live nginx container connected to the "edge" network, and a cert
# already issued for old.alqavitraders.com (see OLD_STACK_SETUP.md).
# ============================================================================

# HTTP -> HTTPS for the old subdomain (also serves ACME challenges).
server {
    listen 80;
    server_name old.alqavitraders.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS for the old subdomain -> proxy everything to the old stack's internal nginx.
server {
    listen 443 ssl;
    server_name old.alqavitraders.com;

    ssl_certificate /etc/letsencrypt/live/old.alqavitraders.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/old.alqavitraders.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    location / {
        proxy_pass http://oldnginx;          # resolved over the shared "edge" network
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
