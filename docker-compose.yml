services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/initdb:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      SECRET_KEY: ${SECRET_KEY}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_HOST: db
      DB_PORT: "3306"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app          # live source mount — no rebuild needed for code changes
      - backend_static:/app/static
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    restart: always

  # Runs next build and writes output to a named volume.
  # Called by deploy.sh for frontend deploys; not a long-running service.
  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile.builder
      args:
        # NEXT_PUBLIC_* must be present at build time — Next.js inlines it into the bundle.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    volumes:
      - frontend_build:/build
    profiles:
      - build

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: node server.js
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
    volumes:
      - frontend_build:/app          # built artifacts from frontend-builder
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    # nginx holds the certificate in memory, so a renewed file on disk changes
    # nothing until it reloads. Reload every 6h to pick up new chains; the reload
    # is graceful and does not drop connections.
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - backend_static:/app/static
      - backend_media:/app/media
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend

  # Renewal loop. WITHOUT a command this container runs certbot with no arguments,
  # which prints help and exits 1 — which is exactly what happened: it never renewed
  # anything and the certificate expired on 18 Aug 2026. certbot only acts when a
  # cert is within 30 days of expiry, so waking twice a day is cheap and leaves
  # ~60 chances to recover from a transient failure before anything expires.
  certbot:
    image: certbot/certbot
    restart: always
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

volumes:
  mysql_data:
  backend_static:
  backend_media:
  frontend_build:
  certbot_www:
  certbot_conf:
