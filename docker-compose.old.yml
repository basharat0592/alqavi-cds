# Isolated "old" stack — runs the alqavi_old branch alongside the live site.
#
# Fully separate from the live stack in /opt/alqavi-cds:
#   * project name "old"  -> containers prefixed "old-", volumes prefixed "old_"
#   * renamed services (olddb/oldbackend/oldfrontend/oldnginx) so nothing collides
#     with the live stack's DNS names on the shared "edge" network
#   * its own fresh MySQL volume (no data shared with live)
#   * no host ports 80/443/8000/3000/3306 — the live nginx reaches oldnginx over "edge"
#
# Usage (see OLD_STACK_SETUP.md for the full runbook):
#   docker network create edge        # once
#   docker compose -f docker-compose.old.yml --env-file .env.old --profile build build
#   docker compose -f docker-compose.old.yml --env-file .env.old --profile build run --rm oldfrontend-builder
#   docker compose -f docker-compose.old.yml --env-file .env.old up -d
name: old

services:
  olddb:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

  oldbackend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_HOST: olddb
      DB_PORT: "3306"
      CELERY_BROKER_URL: redis://oldredis:6379/0
      CELERY_RESULT_BACKEND: redis://oldredis:6379/0
    volumes:
      - ./backend:/app          # live source mount — runs the alqavi_old code
      - backend_static:/app/static
      - backend_media:/app/media
    depends_on:
      olddb:
        condition: service_healthy
    networks:
      - default

  oldredis:
    image: redis:7-alpine
    restart: always
    networks:
      - default

  # Builds the Next.js bundle with the old subdomain baked in, writes to the
  # frontend_build volume. Run once per frontend change (profile: build).
  oldfrontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile.builder
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    volumes:
      - frontend_build:/build
    profiles:
      - build
    networks:
      - default

  oldfrontend:
    image: node:20-alpine
    working_dir: /app
    command: node server.js
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
    volumes:
      - frontend_build:/app
    depends_on:
      - oldbackend
    networks:
      - default

  # Internal reverse proxy for the old stack. Listens on plain HTTP :80 inside the
  # "edge" network only (no host ports). The live nginx terminates TLS for
  # old.alqavitraders.com and proxies to this container by its alias "oldnginx".
  oldnginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./docker/nginx/old.internal.conf:/etc/nginx/conf.d/default.conf
      - backend_static:/app/static
      - backend_media:/app/media
    depends_on:
      - oldfrontend
      - oldbackend
    networks:
      default:
      edge:
        aliases:
          - oldnginx

volumes:
  mysql_data:
  backend_static:
  backend_media:
  frontend_build:

networks:
  default:
  edge:
    external: true
    name: edge
